name: Code Quality
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          # Pinned: an unpinned ruff changes its default rule set between releases.
          pip install "ruff==0.17.3" "black==26.10.1"

      - name: Run ruff
        run: ruff check .

      - name: Run black
        run: black --check .
