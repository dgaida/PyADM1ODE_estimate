[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyadm1ode_estimation"
version = "0.1.2"
description = "State estimation for PyADM1ODE biogas plant models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyadm1",
    "numpy",
    "scipy",
    "pandas",
    "pythonnet",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]
deep_learning = [
    "torch",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyadm1ode_estimation*"]
