[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyadm1ode_estimation"
version = "0.2.0"
description = "State estimation for PyADM1ODE biogas plant models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyadm1 @ git+https://github.com/dgaida/PyADM1ODE.git",
    "numpy",
    "scipy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]
deep_learning = [
    "torch",
    "scikit-learn",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-static-i18n",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin",
    "mike",
    "pymdown-extensions",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyadm1ode_estimation*"]

[tool.pytest.ini_options]
markers = [
    "slow: integration tests that spin up worker pools or take >5 s",
]
